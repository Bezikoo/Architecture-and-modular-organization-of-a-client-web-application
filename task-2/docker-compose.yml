services:
  db:
    image: postgres:latest
    container_name: tickets_management_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets_management
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_tickets:/var/lib/postgresql

volumes:
  postgres_data_tickets:
